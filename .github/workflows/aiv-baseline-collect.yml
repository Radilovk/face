name: aiv-baseline-collect

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Брой въпроси (1-20)'
        required: false
        default: '20'
        type: string
      model:
        description: 'openai | gemini | perplexity | all'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - openai
          - gemini
          - perplexity
      import_only:
        description: 'Skip API collect — fetch from KV + D1 import only'
        required: false
        default: false
        type: boolean
  schedule:
    # Понеделник 06:00 UTC — седмичен baseline snapshot
    - cron: '0 6 * * 1'

concurrency:
  group: aiv-baseline
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-visibility-edge
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      BASELINE_ID: '2026-08-27'
    steps:
      - uses: actions/checkout@v4

      - name: Workflow version
        run: |
          echo "commit=${{ github.sha }}"
          echo "ref=${{ github.ref }}"
          if grep -q 'account_id = "placeholder"' wrangler.toml 2>/dev/null; then
            echo "::error::Stale wrangler.toml with placeholder — update main and re-run"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai-visibility-edge/package-lock.json

      - name: Install
        run: npm ci

      - name: Validate secrets
        run: |
          missing=0
          for key in CF_ACCOUNT_ID CF_API_TOKEN KV_NAMESPACE_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub secret: $key"
              missing=1
            fi
          done
          if [ -z "$OPENAI_API_KEY" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Add OPENAI_API_KEY and/or GEMINI_API_KEY (Perplexity optional)"
            missing=1
          fi
          exit $missing

      - name: Collect baseline responses
        if: ${{ github.event.inputs.import_only != 'true' }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '20' }}"
          MODEL="${{ github.event.inputs.model || 'all' }}"
          npm run baseline:collect -- --limit "$LIMIT" --model "$MODEL"

      - name: Fetch baseline from KV (import-only)
        if: ${{ github.event.inputs.import_only == 'true' }}
        run: npm run baseline:fetch-kv

      - name: Upload to Cloudflare KV (face namespace)
        if: ${{ github.event.inputs.import_only != 'true' }}
        run: npm run baseline:upload-kv

      - name: Patch wrangler.toml (KV + account)
        run: |
          ACCOUNT_ID="${{ secrets.CF_ACCOUNT_ID }}"
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::GitHub secret CF_ACCOUNT_ID is empty — add your Cloudflare account ID"
            exit 1
          fi
          sed -i 's/local-kv-placeholder/${{ secrets.KV_NAMESPACE_ID }}/' wrangler.toml
          sed -i '/^account_id = "placeholder"/d' wrangler.toml
          if ! grep -q '^account_id' wrangler.toml; then
            sed -i "0,/^name = /s//account_id = \"${ACCOUNT_ID}\"\n&/" wrangler.toml
          else
            sed -i "s/^account_id = .*/account_id = \"${ACCOUNT_ID}\"/" wrangler.toml
          fi
          if grep -q placeholder wrangler.toml; then
            echo "::error::wrangler.toml still contains placeholder"
            exit 1
          fi
          echo "wrangler.toml patched OK"
          grep '^account_id' wrangler.toml

      - name: Import runs to D1 (remote)
        run: node scripts/baseline-import-d1.js

      - name: Reprocess → observations (remote D1)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: npm run baseline:reprocess-d1

      - name: Reprocess via Worker (fallback)
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          WORKER_URL: ${{ secrets.AIV_WORKER_URL }}
        run: npm run baseline:reprocess
        continue-on-error: true

      - name: Commit baseline artifacts
        if: ${{ github.event.inputs.import_only != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add baseline/
          if git diff --staged --quiet; then
            echo "No baseline file changes to commit"
          else
            git commit -m "chore(baseline): collect ${{ env.BASELINE_ID }} [skip ci]"
            git push
          fi
        working-directory: ai-visibility-edge
        continue-on-error: true

      - name: Upload artifact backup
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-${{ env.BASELINE_ID }}-${{ github.run_id }}
          path: |
            ai-visibility-edge/baseline/${{ env.BASELINE_ID }}/**/*.json
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          echo "### Baseline collect" >> $GITHUB_STEP_SUMMARY
          echo "- Baseline ID: \`$BASELINE_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "- KV prefix: \`aiv/baseline/$BASELINE_ID/\`" >> $GITHUB_STEP_SUMMARY
          echo "- Namespace: face KV (\`KV_NAMESPACE_ID\`)" >> $GITHUB_STEP_SUMMARY
          for model in openai gemini perplexity; do
            count=$(find baseline/$BASELINE_ID/$model -name '*.json' 2>/dev/null | wc -l || echo 0)
            echo "- $model files: $count" >> $GITHUB_STEP_SUMMARY
          done

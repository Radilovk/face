name: aiv-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ai-visibility-edge/src/**'
      - 'ai-visibility-edge/wrangler.toml'
      - 'ai-visibility-edge/migrations/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-visibility-edge
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ai-visibility-edge/package-lock.json

      - run: npm ci
      - run: npm test

      - name: Patch wrangler.toml (KV + account + D1)
        run: |
          sed -i 's/local-kv-placeholder/${{ secrets.KV_NAMESPACE_ID }}/' wrangler.toml
          if [ -n "${{ secrets.D1_DATABASE_ID }}" ]; then
            sed -i 's/local-d1-placeholder/${{ secrets.D1_DATABASE_ID }}/' wrangler.toml
          fi
          if ! grep -q '^account_id' wrangler.toml; then
            echo "account_id = \"${{ secrets.CF_ACCOUNT_ID }}\"" >> wrangler.toml
          fi

      - name: D1 migrations (remote)
        if: ${{ secrets.D1_DATABASE_ID != '' }}
        run: npx wrangler d1 migrations apply aiv --remote

      - name: Worker secrets
        run: |
          echo "${{ secrets.OPENAI_API_KEY }}" | npx wrangler secret put OPENAI_API_KEY
          echo "${{ secrets.GEMINI_API_KEY }}" | npx wrangler secret put GEMINI_API_KEY

      - name: Deploy Worker
        run: npx wrangler deploy

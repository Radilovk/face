name: aiv-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ai-visibility-edge/src/**'
      - 'ai-visibility-edge/test/**'
      - 'ai-visibility-edge/wrangler.toml'
      - 'ai-visibility-edge/migrations/**'
      - '.github/workflows/aiv-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-visibility-edge
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai-visibility-edge/package-lock.json

      - run: npm ci
      - run: npm test

      - name: Resolve Cloudflare platform IDs
        id: cf
        run: |
          ACCOUNT_ID="${{ secrets.CF_ACCOUNT_ID }}"
          SAAS_ZONE="${{ secrets.SAAS_ZONE_ID }}"
          WORKER_HOST="${{ secrets.AIV_WORKER_URL }}"
          WORKER_HOST="${WORKER_HOST#https://}"
          WORKER_HOST="${WORKER_HOST#http://}"
          WORKER_HOST="${WORKER_HOST%%/*}"

          if [ -z "$SAAS_ZONE" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            SAAS_ZONE=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones?status=active&per_page=50" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);const z=(j.result||[]);console.log((z.find(x=>/radilov|workers|saas/i.test(x.name))||z[0])?.id||'');});")
            echo "Auto-discovered SAAS_ZONE_ID from first/active zone"
          fi

          if [ -z "$WORKER_HOST" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$ACCOUNT_ID" ]; then
            SUB=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/subdomain" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);console.log(j.result?.subdomain||'');});")
            if [ -n "$SUB" ]; then
              WORKER_NAME=$(grep '^name = ' wrangler.toml | head -1 | sed 's/name = "\(.*\)"/\1/')
              WORKER_HOST="${WORKER_NAME}.${SUB}.workers.dev"
              echo "Auto-derived WORKER_PUBLIC_HOST=${WORKER_HOST}"
            fi
          fi

          echo "saas_zone_id=${SAAS_ZONE}" >> "$GITHUB_OUTPUT"
          echo "worker_host=${WORKER_HOST}" >> "$GITHUB_OUTPUT"

      - name: Patch wrangler.toml (KV + account + production vars)
        run: |
          ACCOUNT_ID="${{ secrets.CF_ACCOUNT_ID }}"
          WORKER_HOST="${{ steps.cf.outputs.worker_host }}"
          sed -i 's/local-kv-placeholder/${{ secrets.KV_NAMESPACE_ID }}/' wrangler.toml
          sed -i '/^account_id = "placeholder"/d' wrangler.toml
          if [ -n "$ACCOUNT_ID" ] && ! grep -q '^account_id' wrangler.toml; then
            sed -i "0,/^name = /s//account_id = \"${ACCOUNT_ID}\"\n&/" wrangler.toml
          elif [ -n "$ACCOUNT_ID" ]; then
            sed -i "s/^account_id = .*/account_id = \"${ACCOUNT_ID}\"/" wrangler.toml
          fi
          if ! grep -q '^ENVIRONMENT' wrangler.toml; then
            sed -i '/^\[vars\]/a ENVIRONMENT = "production"' wrangler.toml
          fi
          if [ -n "$WORKER_HOST" ]; then
            if grep -q '^WORKER_PUBLIC_HOST' wrangler.toml; then
              sed -i "s|^WORKER_PUBLIC_HOST = .*|WORKER_PUBLIC_HOST = \"${WORKER_HOST}\"|" wrangler.toml
            else
              sed -i "/^ENVIRONMENT/a WORKER_PUBLIC_HOST = \"${WORKER_HOST}\"" wrangler.toml
            fi
          fi

      - name: D1 migrations (remote)
        run: npx wrangler d1 migrations apply aiv --remote

      - name: Worker secrets
        run: |
          echo "${{ secrets.OPENAI_API_KEY }}" | npx wrangler secret put OPENAI_API_KEY
          echo "${{ secrets.GEMINI_API_KEY }}" | npx wrangler secret put GEMINI_API_KEY
          if [ -n "${{ secrets.PERPLEXITY_API_KEY }}" ]; then
            echo "${{ secrets.PERPLEXITY_API_KEY }}" | npx wrangler secret put PERPLEXITY_API_KEY
          fi
          if [ -n "${{ secrets.ADMIN_TOKEN }}" ]; then
            echo "${{ secrets.ADMIN_TOKEN }}" | npx wrangler secret put ADMIN_TOKEN
          fi
          if [ -n "${{ secrets.CF_API_TOKEN }}" ]; then
            echo "${{ secrets.CF_API_TOKEN }}" | npx wrangler secret put CF_API_TOKEN
          fi
          if [ -n "${{ secrets.CF_ACCOUNT_ID }}" ]; then
            echo "${{ secrets.CF_ACCOUNT_ID }}" | npx wrangler secret put CF_ACCOUNT_ID
          fi
          SAAS_ZONE="${{ secrets.SAAS_ZONE_ID }}"
          if [ -z "$SAAS_ZONE" ]; then
            SAAS_ZONE="${{ steps.cf.outputs.saas_zone_id }}"
          fi
          if [ -n "$SAAS_ZONE" ]; then
            echo "$SAAS_ZONE" | npx wrangler secret put SAAS_ZONE_ID
          fi

      - name: Deploy Worker
        run: npx wrangler deploy

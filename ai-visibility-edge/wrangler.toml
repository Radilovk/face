name = "ai-visibility-edge"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# account_id: via CLOUDFLARE_ACCOUNT_ID env (GitHub secret CF_ACCOUNT_ID in CI)

[[d1_databases]]
binding = "DB"
database_name = "aiv"
database_id = "b5d03061-7656-4c76-b7c6-699d711d07e4"

[[kv_namespaces]]
binding = "CACHE"
# Production / CI: същият namespace като face (KV_NAMESPACE_ID / FACE_ADVICE_KV)
id = "local-kv-placeholder"

[vars]
BASELINE_ID = "2026-08-27"

[triggers]
crons = ["0 3 * * 1"]
